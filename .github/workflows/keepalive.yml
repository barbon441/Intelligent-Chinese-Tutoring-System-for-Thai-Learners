# ⏰ Keepalive — ปลุก HF Spaces (หลับหลัง 48 ชม.) + Supabase (pause หลัง 7 วันไม่มี query)
# วิธีเปิดใช้: ตั้งค่า API_HEALTH_URL ใน repo Settings → Secrets and variables → Actions → Variables
# (ยังไม่ deploy = ยังไม่ต้องทำอะไร — workflow จะข้ามเอง)

name: keepalive

on:
  schedule:
    - cron: "0 3 * * *" # ทุกวัน 03:00 UTC (= 10:00 เวลาไทย)
  workflow_dispatch: {} # กดรันเองได้จากแท็บ Actions (เช่น ก่อนวันเดโม)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API /health (ปลุก HF Spaces + Supabase ในตัว)
        run: |
          if [ -z "${{ vars.API_HEALTH_URL }}" ]; then
            echo "ยังไม่ได้ตั้ง API_HEALTH_URL — ข้าม (ตั้งได้ที่ Settings > Actions > Variables)"
            exit 0
          fi
          curl -fsS --max-time 120 "${{ vars.API_HEALTH_URL }}" && echo "ปลุกสำเร็จ"
